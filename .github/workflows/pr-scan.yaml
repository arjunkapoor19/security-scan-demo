name: PR Security Scan

on:
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch origin main

      - name: Run Semgrep Scan
        uses: returntocorp/semgrep-action@v1
        with:
          entryPoint: semgrep
          args: ci --baseline-commit=origin/main --metrics=off

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}


      - name: Run Trivy SCA scan
        uses: aquasecurity/trivy-action@0.22.0
        with:
          scan-type: fs
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json

      - name: Comment Trivy results on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('trivy-results.json')) return

            const data = JSON.parse(fs.readFileSync('trivy-results.json', 'utf8'))

            let comment = `### Trivy SCA Report\n`
            let found = false

            for (const result of data.Results || []) {
            for (const vuln of result.Vulnerabilities || []) {
                found = true
                comment += `- **${vuln.VulnerabilityID}** (${vuln.Severity}) in \`${vuln.PkgName}\` ${vuln.InstalledVersion}\n`
              }
            }
            if (!found) {
            comment += `No HIGH or CRITICAL dependency vulnerabilities found.`
            }

            await github.rest.issues.createComment({
            issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

      - name: Start demo app
        run: |
          pip install flask
          python app.py &
          sleep 5

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000"
          cmd_options: "-a"

      - name: Comment ZAP results on PR
        uses: actions/github-script@v7
        with:
        script: |
          const fs = require('fs')

          if (!fs.existsSync('report_json.json')) {
            console.log('No ZAP report found')
            return
          }

          const data = JSON.parse(fs.readFileSync('report_json.json', 'utf8'))
          const alerts = data.site?.[0]?.alerts || []
          let comment = `### DAST Report (OWASP ZAP)\n`
          if (alerts.length === 0) {
            comment += `No issues detected by baseline scan.`
          } else {
            for (const alert of alerts) {
              comment += `- **${alert.alert}** (${alert.riskdesc})\n`
            }
          }

          if (!context.issue.number) return

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          })